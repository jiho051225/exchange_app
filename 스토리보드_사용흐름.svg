<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#26384a}.title{font-size:34px;font-weight:700}.row{font-size:24px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#667b8d}.white{fill:white}.card{fill:white;stroke:#cbd9e4;stroke-width:2}.blue{fill:#1677d2}.arrow{fill:none;stroke:#5488b5;stroke-width:3;marker-end:url(#tip)}.line{stroke:#d9e3eb;stroke-width:2}</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5488b5"/></marker><pattern id="map" width="38" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(24)"><rect width="38" height="38" fill="#ecf2f6"/><path d="M0 0H38M0 0V38" stroke="white" stroke-width="8"/></pattern></defs>
<rect width="1800" height="1080" fill="#f5f8fb"/><text x="50" y="61" class="title">TRIPLOG · 화면 이동 스토리보드</text><text x="50" y="93" class="small">사용자의 행동, 다음 화면, 저장 후 보이는 결과를 한눈에 확인하는 흐름</text>

<text x="50" y="151" class="row">A. 장소 하나를 기록하기</text>
<g transform="translate(50 177)"><rect width="310" height="207" rx="12" class="card"/><rect x="17" y="17" width="276" height="26" rx="4" fill="#e9f3fb"/><text x="28" y="36" class="body">① 메인 지도</text><rect x="18" y="55" width="274" height="90" rx="5" fill="url(#map)"/><circle cx="127" cy="98" r="8" fill="#e25871"/><circle cx="205" cy="116" r="8" fill="#e25871"/><rect x="17" y="156" width="112" height="32" rx="4" class="blue"/><text x="29" y="178" class="body white">+ 기록 추가</text></g>
<path d="M370 279H416" class="arrow"/><text x="367" y="260" class="small">누르기</text>
<g transform="translate(425 177)"><rect width="310" height="207" rx="12" class="card"/><text x="18" y="39" class="head">② 기록 유형 선택</text><path d="M18 52H292" class="line"/><text x="26" y="86" class="body">📍 장소로 기록</text><text x="26" y="114" class="small">방문 장소 하나 선택</text><rect x="26" y="142" width="138" height="35" rx="4" class="blue"/><text x="43" y="166" class="body white">장소 선택하기</text></g>
<path d="M745 279H791" class="arrow"/><text x="748" y="260" class="small">검색</text>
<g transform="translate(800 177)"><rect width="310" height="207" rx="12" class="card"/><text x="18" y="39" class="head">③ 장소 상세</text><rect x="17" y="55" width="168" height="76" rx="4" fill="url(#map)"/><text x="199" y="75" class="small">옆 영역</text><text x="199" y="96" class="small">관련 여행 목록</text><text x="17" y="152" class="body">장소 정보와 학생 후기</text><rect x="17" y="166" width="112" height="27" rx="4" class="blue"/><text x="30" y="185" class="small white">내 후기 작성</text></g>
<path d="M1120 279H1166" class="arrow"/><text x="1117" y="260" class="small">누르기</text>
<g transform="translate(1175 177)"><rect width="310" height="207" rx="12" class="card"/><text x="18" y="39" class="head">④ 별도 기록 작성</text><text x="18" y="72" class="body">장소 · 방문 날짜</text><path d="M18 83H292" class="line"/><text x="18" y="110" class="small">사진 · 별점 · 후기 · 팁 선택</text><rect x="18" y="145" width="92" height="34" rx="4" fill="#53697a"/><text x="28" y="168" class="body white">임시저장</text><rect x="122" y="145" width="92" height="34" rx="4" class="blue"/><text x="140" y="168" class="body white">공개</text></g>
<path d="M1495 279H1541" class="arrow"/><text x="1496" y="260" class="small">저장</text>
<g transform="translate(1550 177)"><rect width="200" height="207" rx="12" class="card"/><text x="18" y="39" class="head">⑤ 공개 결과</text><text x="18" y="78" class="body">지도 핀 표시</text><text x="18" y="108" class="body">장소에 기록 표시</text><text x="18" y="138" class="body">다른 사용자도 열람</text><text x="18" y="175" class="small">새로고침 후 유지</text></g>

<text x="50" y="448" class="row">B. 날짜별 여행을 기록하기</text>
<g transform="translate(50 476)"><rect width="310" height="215" rx="12" class="card"/><text x="18" y="39" class="head">① 메인 → + 기록 추가</text><rect x="18" y="62" width="274" height="110" rx="5" fill="url(#map)"/><text x="26" y="195" class="small">여행으로 기록을 선택</text></g>
<path d="M370 584H416" class="arrow"/>
<g transform="translate(425 476)"><rect width="310" height="215" rx="12" class="card"/><text x="18" y="39" class="head">② 여행 작성</text><text x="18" y="75" class="body">제목 · 시작일 · 종료일</text><text x="18" y="106" class="body">1일 차: 장소 A → 장소 B</text><rect x="23" y="119" width="136" height="27" rx="13" class="blue"/><text x="39" y="138" class="small white">+ 교통수단 선택</text><text x="18" y="177" class="body">2일 차: 장소 C</text></g>
<path d="M745 584H791" class="arrow"/><text x="745" y="564" class="small">공개</text>
<g transform="translate(800 476)"><rect width="310" height="215" rx="12" class="card"/><text x="18" y="39" class="head">③ 여행 상세</text><rect x="18" y="58" width="119" height="115" rx="5" fill="url(#map)"/><path d="M42 149L72 105L108 131" fill="none" stroke="#1677d2" stroke-width="4" stroke-dasharray="6 4"/><text x="151" y="77" class="body">전체/날짜별 경로</text><text x="151" y="111" class="body">방문 장소·순서</text><text x="151" y="145" class="body">선택한 교통수단</text><text x="18" y="197" class="small">장소를 누르면 장소 상세로 이동</text></g>
<path d="M1120 584H1166" class="arrow"/><text x="1122" y="564" class="small">장소</text>
<g transform="translate(1175 476)"><rect width="575" height="215" rx="12" class="card"/><text x="18" y="39" class="head">④ 장소 상세에 자동 연결</text><rect x="18" y="59" width="330" height="135" rx="5" fill="#eef5fa"/><text x="30" y="85" class="body">중심: 장소 기본 정보</text><text x="30" y="116" class="body">학생 방문 기록·후기</text><text x="30" y="147" class="body">여행에서 등록한 방문 기록</text><rect x="362" y="59" width="194" height="135" rx="5" fill="#eef5fa"/><text x="374" y="85" class="body">옆: 공개 여행 목록</text><text x="374" y="120" class="small">여행 하나 선택 →</text><text x="374" y="147" class="small">전체 여행 상세</text></g>

<text x="50" y="756" class="row">C. 다른 학생의 정보를 찾아보기</text>
<g transform="translate(50 783)"><rect width="490" height="206" rx="12" class="card"/><text x="21" y="43" class="head">지도 핀 또는 장소 목록 선택</text><rect x="21" y="63" width="448" height="105" rx="5" fill="url(#map)"/><circle cx="230" cy="117" r="9" fill="#e25871"/><text x="21" y="191" class="small">같은 장소의 공개 기록이 하나의 핀에 모임</text></g>
<path d="M552 886H610" class="arrow"/>
<g transform="translate(622 783)"><rect width="490" height="206" rx="12" class="card"/><text x="21" y="43" class="head">장소 정보·후기 먼저 읽기</text><text x="21" y="83" class="body">질문은 방문 기록에 댓글로 남김</text><text x="21" y="117" class="body">옆 목록에서 관심 여행 선택</text><rect x="21" y="148" width="244" height="33" rx="4" class="blue"/><text x="34" y="171" class="body white">관련 공개 여행 보기 →</text></g>
<path d="M1124 886H1182" class="arrow"/>
<g transform="translate(1194 783)"><rect width="556" height="206" rx="12" class="card"/><text x="21" y="43" class="head">전체 여행 일정·경로 확인</text><text x="21" y="84" class="body">날짜별 장소와 이동 순서</text><text x="21" y="118" class="body">장소별 선택 교통수단과 이야기</text><text x="21" y="152" class="body">여행 댓글·답글로 질문</text><text x="21" y="187" class="small">메인의 공개 여행 카드에서도 이 화면으로 바로 이동</text></g>
<text x="50" y="1043" class="small">설계 기준: PRD.md · 스토리보드의 예시 데이터는 실제 저장 데이터가 아님 · 작성자 권한은 익명 브라우저 세션으로 확인</text>
</svg>
