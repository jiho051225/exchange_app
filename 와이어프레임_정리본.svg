<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
<style>
  text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#233446} .title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#617487}.panelTitle{font-size:23px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:13px}.tiny{font-size:11px}.muted{fill:#6c7c8a}.blue{fill:#1677d2}.white{fill:white}.line{stroke:#d4dfe8;stroke-width:2}.card{fill:#fff;stroke:#c6d5e1;stroke-width:2}.soft{fill:#eef5fa}.button{fill:#1677d2}.grayButton{fill:#53697a}.pin{fill:#e25871}
